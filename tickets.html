<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tickets Portal - KickOff Hub</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <nav class="navbar navbar-expand-lg navbar-dark fixed-top custom-navbar">
      <div class="container">
        <a class="navbar-brand" href="index.html">⚽ KickOff<span>Hub</span></a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
          <ul class="navbar-nav ms-auto">
            <li class="nav-item"><a class="nav-link" href="index.html">Live & Matches</a></li>
            <li class="nav-item"><a class="nav-link" href="standings.html">Standings</a></li>
            <li class="nav-item"><a class="nav-link" href="teams.html">Clubs Inspector</a></li>
            <li class="nav-item"><a class="nav-link active" href="tickets.html">Get Tickets</a></li>
            <li class="nav-item"><a class="nav-link" href="https://www.uefa.com/uefachampionsleague/ticketing/" target="_blank">UCL Tickets ↗</a></li>
          </ul>
        </div>
      </div>
    </nav>
  </header>

  <main class="container my-5">
    <div class="row justify-content-center">
      <div class="col-lg-8">
        <div class="glass-card p-4 p-md-5">
          <span class="badge badge-ucl mb-2">OFFICIAL TICKETING PORTAL</span>
          <h1 class="fw-bold h2 mb-2">Book Matchday Tickets</h1>
          <p class="text-muted mb-4">Reserve your seats for matches across the Top 5 Leagues and Champions League fixtures.</p>

          <form id="ticketForm" novalidate>
            <div class="mb-3">
              <label for="fullName" class="form-label text-muted small fw-bold">Full Name</label>
              <input type="text" class="form-control" id="fullName" placeholder="e.g. John Doe" required>
            </div>

            <div class="mb-3">
              <label for="email" class="form-label text-muted small fw-bold">Email Address</label>
              <input type="email" class="form-control" id="email" placeholder="name@example.com" required>
            </div>

            <div class="row g-3">
              <div class="col-md-8">
                <label for="matchSelect" class="form-label text-muted small fw-bold">Select Fixture</label>
                <select class="form-select" id="matchSelect" required>
                  <option value="" selected disabled>Choose a match...</option>
                  <option value="Manchester City vs Real Madrid (UCL)">Manchester City vs Real Madrid [UCL] ($75)</option>
                  <option value="Arsenal vs Chelsea (Premier League)">Arsenal vs Chelsea [Premier League] ($55)</option>
                  <option value="Real Madrid vs Barcelona (La Liga)">Real Madrid vs Barcelona [La Liga] ($65)</option>
                  <option value="AC Milan vs Inter Milan (Serie A)">AC Milan vs Inter Milan [Serie A] ($45)</option>
                  <option value="Bayern Munich vs Dortmund (Bundesliga)">Bayern Munich vs Dortmund [Bundesliga] ($50)</option>
                  <option value="PSG vs Marseille (Ligue 1)">PSG vs Marseille [Ligue 1] ($45)</option>
                </select>
              </div>

              <div class="col-md-4">
                <label for="quantity" class="form-label text-muted small fw-bold">Quantity</label>
                <input type="number" class="form-control" id="quantity" min="1" max="10" value="1" required>
              </div>
            </div>

            <button type="submit" class="btn btn-accent w-100 py-3 mt-4">Confirm Ticket Reservation</button>
          </form>

          <!-- Interactive Alert Feedback -->
          <div id="formAlert" class="d-none mt-4"></div>
        </div>
      </div>
    </div>
  </main>

  <footer class="py-4 text-center text-muted">
    <div class="container">
      <p class="mb-0">&copy; 2026 KickOff Hub App. All rights reserved.</p>
    </div>
  </footer>

  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
