<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>League Tables - KickOff Hub</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <nav class="navbar navbar-expand-lg navbar-dark fixed-top custom-navbar">
      <div class="container">
        <a class="navbar-brand" href="index.html">⚽ KickOff<span>Hub</span></a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
          <ul class="navbar-nav ms-auto">
            <li class="nav-item"><a class="nav-link" href="index.html">Live & Matches</a></li>
            <li class="nav-item"><a class="nav-link active" href="standings.html">Standings</a></li>
            <li class="nav-item"><a class="nav-link" href="teams.html">Clubs Inspector</a></li>
            <li class="nav-item"><a class="nav-link" href="tickets.html">Get Tickets</a></li>
            <li class="nav-item"><a class="nav-link" href="https://www.uefa.com" target="_blank">UEFA Official ↗</a></li>
          </ul>
        </div>
      </div>
    </nav>
  </header>

  <main class="container my-5">
    <div class="glass-card mb-4">
      <div class="row align-items-center">
        <div class="col-md-5 mb-3 mb-md-0">
          <h1 class="h3 fw-bold mb-1">League Standings</h1>
          <p class="text-muted small mb-0">Official positions, points, and qualification zones.</p>
        </div>
        <div class="col-md-4 mb-3 mb-md-0">
          <label class="form-label text-muted small mb-1">Select League</label>
          <select id="leagueSelect" class="form-select">
            <option value="Premier League">Premier League (20 Clubs)</option>
            <option value="La Liga">La Liga (20 Clubs)</option>
            <option value="Serie A">Serie A (20 Clubs)</option>
            <option value="Bundesliga">Bundesliga (18 Clubs)</option>
            <option value="Ligue 1">Ligue 1 (18 Clubs)</option>
            <option value="UEFA Champions League">UEFA Champions League (36 Clubs)</option>
          </select>
        </div>
        <div class="col-md-3 text-md-end pt-3 pt-md-0">
          <button id="sortPointsBtn" class="btn btn-outline-success w-100">Sort Points</button>
        </div>
      </div>
    </div>

    <!-- League Standings Table -->
    <div class="table-responsive glass-card p-0 overflow-hidden">
      <table class="table table-dark table-hover custom-table align-middle mb-0">
        <thead>
          <tr>
            <th scope="col" style="width: 60px;">Pos</th>
            <th scope="col">Club</th>
            <th scope="col" class="text-center">MP</th>
            <th scope="col" class="text-center">W</th>
            <th scope="col" class="text-center">D</th>
            <th scope="col" class="text-center">L</th>
            <th scope="col" class="text-center">PTS</th>
          </tr>
        </thead>
        <tbody id="standings-body">
          <!-- Javascript renders rows dynamically -->
        </tbody>
      </table>
    </div>
  </main>

  <footer class="py-4 text-center text-muted">
    <div class="container">
      <p class="mb-0">&copy; 2026 KickOff Hub App. All rights reserved.</p>
    </div>
  </footer>

  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
