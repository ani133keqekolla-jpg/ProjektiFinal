<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Club Directory - KickOff Hub</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <nav class="navbar navbar-expand-lg navbar-dark fixed-top custom-navbar">
      <div class="container">
        <a class="navbar-brand" href="index.html">⚽ KickOff<span>Hub</span></a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
          <ul class="navbar-nav ms-auto">
            <li class="nav-item"><a class="nav-link" href="index.html">Live & Matches</a></li>
            <li class="nav-item"><a class="nav-link" href="standings.html">Standings</a></li>
            <li class="nav-item"><a class="nav-link active" href="teams.html">Clubs Inspector</a></li>
            <li class="nav-item"><a class="nav-link" href="tickets.html">Get Tickets</a></li>
            <li class="nav-item"><a class="nav-link" href="https://www.fifa.com" target="_blank">FIFA ↗</a></li>
          </ul>
        </div>
      </div>
    </nav>
  </header>

  <main class="container my-5">
    <div class="glass-card mb-4">
      <div class="row align-items-center">
        <div class="col-md-6 mb-3 mb-md-0">
          <h1 class="h3 fw-bold mb-1">Clubs Inspector</h1>
          <p class="text-muted small mb-0">Browse all clubs across Premier League, La Liga, Serie A, Bundesliga, Ligue 1 & UCL.</p>
        </div>
        <div class="col-md-6">
          <div class="row g-2">
            <div class="col-6">
              <select id="teamLeagueFilter" class="form-select">
                <option value="Premier League">Premier League</option>
                <option value="La Liga">La Liga</option>
                <option value="Serie A">Serie A</option>
                <option value="Bundesliga">Bundesliga</option>
                <option value="Ligue 1">Ligue 1</option>
                <option value="UEFA Champions League">UCL</option>
              </select>
            </div>
            <div class="col-6">
              <input type="text" id="teamSearch" class="form-control" placeholder="Search team...">
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Teams Cards Grid -->
    <div class="row g-4" id="teams-grid">
      <!-- JavaScript renders team cards dynamically -->
    </div>
  </main>

  <footer class="py-4 text-center text-muted">
    <div class="container">
      <p class="mb-0">&copy; 2026 KickOff Hub App. All rights reserved.</p>
    </div>
  </footer>

  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
